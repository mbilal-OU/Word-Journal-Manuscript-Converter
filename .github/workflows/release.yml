name: Build and publish release apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: Word-Journal-Manuscript-Converter-Linux-x64.tar.gz
            data_sep: ":"
          - os: windows-latest
            asset: Word-Journal-Manuscript-Converter-Windows-x64.zip
            data_sep: ";"
          - os: macos-latest
            asset: Word-Journal-Manuscript-Converter-macOS.zip
            data_sep: ":"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build CLI
        run: >-
          pyinstaller --clean --onefile
          --name word-journal-converter
          --paths src
          --collect-data word_journal_manuscript_converter
          --add-data "src/word_journal_manuscript_converter/bundled_profiles${{ matrix.data_sep }}word_journal_manuscript_converter/bundled_profiles"
          packaging/word_journal_converter_cli.py

      - name: Build GUI
        if: runner.os != 'Linux'
        run: >-
          pyinstaller --clean --onefile --windowed
          --name Word-Journal-Manuscript-Converter
          --icon src/word_journal_manuscript_converter/assets/app-icon.ico
          --paths src
          --collect-data word_journal_manuscript_converter
          --add-data "src/word_journal_manuscript_converter/bundled_profiles${{ matrix.data_sep }}word_journal_manuscript_converter/bundled_profiles"
          packaging/word_journal_converter_gui.py

      - name: Smoke test frozen CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\dist\word-journal-converter.exe --version
          & .\dist\word-journal-converter.exe profiles

      - name: Smoke test frozen CLI on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/word-journal-converter --version
          ./dist/word-journal-converter profiles

      - name: Package Linux release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release/package
          cp dist/word-journal-converter release/package/
          cp README.md LICENSE PRIVACY.md release/package/
          tar -C release/package -czf "release/${{ matrix.asset }}" .
          sha256sum "release/${{ matrix.asset }}" > "release/${{ matrix.asset }}.sha256"

      - name: Package macOS release
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p release/package
          cp dist/word-journal-converter release/package/
          if [ -d dist/Word-Journal-Manuscript-Converter.app ]; then
            cp -R dist/Word-Journal-Manuscript-Converter.app release/package/
          elif [ -f dist/Word-Journal-Manuscript-Converter ]; then
            cp dist/Word-Journal-Manuscript-Converter release/package/
          fi
          cp README.md LICENSE PRIVACY.md release/package/
          (cd release/package && zip -r "../${{ matrix.asset }}" .)
          shasum -a 256 "release/${{ matrix.asset }}" > "release/${{ matrix.asset }}.sha256"

      - name: Package Windows portable release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/package | Out-Null
          Copy-Item dist/word-journal-converter.exe release/package/
          Copy-Item dist/Word-Journal-Manuscript-Converter.exe release/package/
          Copy-Item README.md,LICENSE,PRIVACY.md release/package/
          New-Item -ItemType Directory -Force -Path release/package/word-addin | Out-Null
          Copy-Item integrations/word-addin/manifest.xml release/package/word-addin/
          Copy-Item docs/WORD_ADDIN.md release/package/word-addin/
          Compress-Archive -Path release/package/* -DestinationPath "release/${{ matrix.asset }}" -Force
          $hash = (Get-FileHash "release/${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Set-Content "release/${{ matrix.asset }}.sha256"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows-installer.iss
          $installer = "release/Word-Journal-Manuscript-Converter-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer was not created." }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  Word-Journal-Manuscript-Converter-Setup.exe" | Set-Content "$installer.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release/*

      - name: Attach assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
