name: Build release apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build CLI
        run: pyinstaller --onefile --name word-journal-converter --paths src packaging/word_journal_converter_cli.py
      - name: Build GUI
        if: runner.os != 'Linux'
        run: pyinstaller --onefile --windowed --name Word-Journal-Manuscript-Converter --paths src packaging/word_journal_converter_gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: Word-Journal-Manuscript-Converter-${{ matrix.os }}
          path: |
            dist/word-journal-converter*
            dist/Word-Journal-Manuscript-Converter*
